name: Backroom durable wake queue SQL

permissions:
  contents: read

concurrency:
  group: backroom-wake-queue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, feat/backroom-coordination-core-v1]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  durable-queue-sql:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated service roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          create schema auth;
          create table auth.users (id uuid primary key);
          create table public.rooms (id uuid primary key, owner_id uuid not null references auth.users(id), title text not null default 'CI room', objective text not null default '', created_at timestamptz not null default now());
          create table public.participants (
            id uuid primary key,
            room_id uuid not null references public.rooms(id),
            display_name text not null default 'CI participant',
            user_id uuid references auth.users(id),
            kind text not null check (kind in ('human','original_session','model','external_agent')),
            status text not null default 'waiting'
          );
          create table public.agent_connections (
            id uuid primary key default gen_random_uuid(),
            room_id uuid not null references public.rooms(id),
            participant_id uuid not null references public.participants(id),
            owner_id uuid not null references auth.users(id),
            credential_digest text not null unique,
            expires_at timestamptz not null,
            revoked_at timestamptz
          );
          create table public.messages (
            id uuid primary key default gen_random_uuid(),
            room_id uuid not null references public.rooms(id),
            sender_id uuid not null references public.participants(id),
            body text not null check (char_length(body) between 1 and 10000),
            source_message_id text,
            created_at timestamptz not null default now()
          );
          create table public.rub_minds_mcp_sessions (
            session_digest text primary key,
            agent_credential_ciphertext text,
            room_id uuid,
            participant_id uuid,
            expires_at timestamptz not null,
            terminated_at timestamptz
          );
          SQL
      - name: Apply durable wake queue migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261029090000_backroom_wake_queue.sql
      - name: Test idempotency, claims, leases, retry, cancellation and least privilege
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/backroom_wake_queue.sql
