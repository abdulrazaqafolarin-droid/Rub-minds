name: Backroom durable wake queue SQL

permissions:
  contents: read

concurrency:
  group: backroom-wake-queue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, feat/backroom-coordination-core-v1]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  durable-queue-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated service roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          create schema auth;
          create table auth.users (id uuid primary key);
          create or replace function auth.uid()
          returns uuid
          language sql stable
          set search_path = ''
          as $$
            select nullif(pg_catalog.current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          create publication supabase_realtime;
          create table public.rooms (id uuid primary key, owner_id uuid not null references auth.users(id), title text not null default 'CI room', objective text not null default '', created_at timestamptz not null default now());
          create table public.participants (
            id uuid primary key,
            room_id uuid not null references public.rooms(id),
            display_name text not null default 'CI participant',
            user_id uuid references auth.users(id),
            kind text not null check (kind in ('human','original_session','model','external_agent')),
            status text not null default 'waiting'
          );
          create table public.agent_connections (
            id uuid primary key default gen_random_uuid(),
            room_id uuid not null references public.rooms(id),
            participant_id uuid not null references public.participants(id),
            owner_id uuid not null references auth.users(id),
            credential_digest text not null unique,
            expires_at timestamptz not null,
            revoked_at timestamptz
          );
          create table public.messages (
            id uuid primary key default gen_random_uuid(),
            room_id uuid not null references public.rooms(id),
            sender_id uuid not null references public.participants(id),
            body text not null check (char_length(body) between 1 and 10000),
            source_message_id text,
            created_at timestamptz not null default now()
          );
          create table public.rub_minds_mcp_sessions (
            session_digest text primary key,
            agent_credential_ciphertext text,
            agent_credential_digest text,
            room_id uuid,
            participant_id uuid,
            last_seen_at timestamptz not null default now(),
            expires_at timestamptz not null,
            terminated_at timestamptz
          );
          -- The bridge-state rejoin function locks and deletes the prior
          -- idempotency row. This is a pre-existing production table, so the
          -- isolated CI database must model its minimum contract explicitly.
          create table public.rub_minds_mcp_join_requests (
            session_digest text primary key
              check (length(session_digest) = 64 and session_digest !~ '[^a-f0-9]'),
            invite_token_hash text not null
              check (length(invite_token_hash) = 64 and invite_token_hash !~ '[^a-f0-9]'),
            agent_label text not null
              check (char_length(agent_label) between 1 and 80),
            credential_digest text not null
              check (length(credential_digest) = 64 and credential_digest !~ '[^a-f0-9]'),
            room_id uuid not null,
            participant_id uuid not null,
            expires_at timestamptz not null,
            created_at timestamptz not null default now()
          );
          alter table public.rub_minds_mcp_join_requests enable row level security;
          revoke all on table public.rub_minds_mcp_join_requests from public, anon, authenticated;
          grant all on table public.rub_minds_mcp_join_requests to service_role;
          create index rub_minds_mcp_join_requests_expiry_idx
            on public.rub_minds_mcp_join_requests (expires_at);
          -- Minimal isolated device/screen schema required by the native binding attestation migration.
          create table public.backroom_devices (
            device_id uuid primary key,
            owner_id uuid not null references auth.users(id),
            token_digest text not null,
            device_label text not null,
            platform text not null,
            status text not null default 'active'
          );
          create table public.backroom_device_room_bindings (
            device_id uuid not null references public.backroom_devices(device_id),
            room_id uuid not null references public.rooms(id),
            owner_id uuid not null references auth.users(id),
            created_at timestamptz not null default now(),
            revoked_at timestamptz,
            primary key(device_id,room_id)
          );
          create table public.backroom_device_apps (
            device_id uuid not null references public.backroom_devices(device_id),
            package_name text not null,
            app_label text not null,
            signing_certificate_sha256 text not null,
            version_name text not null default '',
            primary key(device_id,package_name)
          );
          create table public.backroom_desktop_sessions (
            session_id uuid primary key,
            device_id uuid not null references public.backroom_devices(device_id),
            room_id uuid not null references public.rooms(id),
            requested_by uuid not null references auth.users(id),
            session_type text not null,
            status text not null default 'active',
            created_at timestamptz not null default now(),
            expires_at timestamptz not null,
            stopped_at timestamptz
          );
          SQL
      - name: Apply durable wake queue migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261029090000_backroom_wake_queue.sql
      - name: Apply durable MCP bridge-state migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261101221132_mcp_bridge_state.sql
      - name: Apply explicit 24-hour Auto grant migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261102221500_backroom_wake_grant_24h_auto_consent.sql
      - name: Revoke participant wake bindings when an MCP session leaves
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261102223000_revoke_backroom_wake_on_mcp_leave.sql
      - name: Add provider-conversation identity to bindings and durable wake leases
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261104111500_backroom_provider_conversation_identity_queue.sql
      - name: Add Android native result settlement to durable wake leases
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261105110000_backroom_android_native_wake_queue_settlement.sql
      - name: Add device-attested Android native group bindings
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261106143000_backroom_android_native_binding_attestation.sql
      - name: Add atomic Android native wake queue forwarder
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261107090000_backroom_android_native_wake_forwarder.sql
      - name: Require current device attestation for native ACK settlement
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261107110000_backroom_android_native_wake_attested_settlement.sql
      - name: Test idempotency, claims, leases, retry, cancellation and least privilege
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/backroom_wake_queue.sql
      - name: Apply the additive group-task coordination migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261101040000_group_task_coordination.sql
      - name: Add group-task foreign-key indexes
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261101164016_group_task_fk_indexes.sql
      - name: Add criterion-level review evidence and replace the bypassable review RPC
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261101221147_group_task_review_criterion_evidence.sql
      - name: Revoke service-role execution on human review RPC
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261101221342_restrict_group_task_review_service_role_execute.sql
      - name: Exercise task lifecycle, dependencies, MCP-scoped AI actions and existing Backroom wake queue
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/group_task_coordination.sql
      - name: Verify private MCP bridge-state and atomic participant-leave security
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/mcp_bridge_state.sql
