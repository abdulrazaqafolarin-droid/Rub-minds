name: Validate Rub Minds
permissions:
  contents: read
concurrency:
  group: rub-minds-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, feat/group-task-coordination-v1]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  mcp-migration:
    # Run validation on draft PRs as well; draft status does not imply a pass.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply and smoke-test hosted MCP migration on isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          create table public.agent_request_log(id bigint primary key);
          grant all on public.agent_request_log to anon, authenticated;
          create table public.room_invites(
            id uuid primary key default gen_random_uuid(),
            token_hash text not null unique,
            room_id uuid not null,
            created_by uuid not null,
            expires_at timestamptz not null,
            revoked_at timestamptz,
            allow_ai boolean not null default true,
            max_ai_uses integer not null default 5,
            ai_uses integer not null default 0
          );
          create table public.participants(
            id uuid primary key default gen_random_uuid(),
            room_id uuid not null,
            display_name text not null,
            kind text not null,
            status text not null
          );
          create table public.agent_connections(
            id uuid primary key default gen_random_uuid(),
            room_id uuid not null,
            participant_id uuid not null,
            owner_id uuid not null,
            credential_digest text not null unique,
            expires_at timestamptz not null,
            revoked_at timestamptz
          );
          SQL
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261019120000_hosted_mcp_sessions.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261021150000_atomic_mcp_join_idempotency.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261022100000_public_invite_rate_limits.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.room_invites(token_hash, room_id, created_by, expires_at, allow_ai, max_ai_uses, ai_uses)
            values (encode(sha256(convert_to(repeat('e',64), 'UTF8')), 'hex'),
                    '10000000-0000-0000-0000-000000000002',
                    '20000000-0000-0000-0000-000000000002',
                    now() + interval '1 hour', true, 3, 0);
          SQL
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "begin; select public.redeem_ai_room_invite_idempotent(repeat('e',64), 'Concurrent agent', repeat('f',64), repeat('1',64)); select pg_sleep(1); commit;" > "$RUNNER_TEMP/mcp-join-a.log" 2>&1 &
          join_a=$!
          sleep 0.15
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "select public.redeem_ai_room_invite_idempotent(repeat('e',64), 'Concurrent agent', repeat('f',64), repeat('1',64));" > "$RUNNER_TEMP/mcp-join-b.log" 2>&1 || { cat "$RUNNER_TEMP/mcp-join-b.log"; exit 1; }
          wait "$join_a" || { cat "$RUNNER_TEMP/mcp-join-a.log"; exit 1; }
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $test$
          declare
            allowed boolean;
            counter integer;
            join_result jsonb;
          begin
            if not (select relrowsecurity from pg_class where oid = 'public.rub_minds_mcp_sessions'::regclass) then
              raise exception 'RLS must be enabled on MCP sessions';
            end if;
            if has_table_privilege('anon', 'public.rub_minds_mcp_sessions', 'SELECT')
              or has_table_privilege('authenticated', 'public.rub_minds_mcp_sessions', 'SELECT') then
              raise exception 'Client roles must not read MCP sessions';
            end if;
            if has_table_privilege('anon', 'public.agent_request_log', 'SELECT')
              or has_table_privilege('authenticated', 'public.agent_request_log', 'SELECT') then
              raise exception 'Client roles must not read agent request logs';
            end if;
            if not (select relrowsecurity from pg_class where oid = 'public.public_request_rate_limits'::regclass) then
              raise exception 'Public request rate limits must have RLS enabled';
            end if;
            if has_table_privilege('anon', 'public.public_request_rate_limits', 'SELECT')
              or has_table_privilege('authenticated', 'public.public_request_rate_limits', 'SELECT') then
              raise exception 'Client roles must not read public rate-limit records';
            end if;
            if has_function_privilege('anon', 'public.consume_public_request_rate_limit(text,text,integer,integer)', 'EXECUTE')
              or has_function_privilege('authenticated', 'public.consume_public_request_rate_limit(text,text,integer,integer)', 'EXECUTE')
              or not has_function_privilege('service_role', 'public.consume_public_request_rate_limit(text,text,integer,integer)', 'EXECUTE') then
              raise exception 'Public rate-limit RPC grants are incorrect';
            end if;
            if not public.consume_public_request_rate_limit(repeat('9',64), 'redeem-ai-invite', 2, 60) then
              raise exception 'First public request should be allowed';
            end if;
            if not public.consume_public_request_rate_limit(repeat('9',64), 'redeem-ai-invite', 2, 60) then
              raise exception 'Second public request should be allowed';
            end if;
            if public.consume_public_request_rate_limit(repeat('9',64), 'redeem-ai-invite', 2, 60) then
              raise exception 'Public requests beyond the limit must be blocked';
            end if;
            update public.public_request_rate_limits
              set window_started_at = now() - interval '61 seconds', request_count = 99
              where key_hash = repeat('9',64) and bucket = 'redeem-ai-invite';
            if not public.consume_public_request_rate_limit(repeat('9',64), 'redeem-ai-invite', 2, 60) then
              raise exception 'Public rate-limit window must reset';
            end if;
            begin
              perform public.consume_public_request_rate_limit(repeat('9',64), 'unknown-bucket', 2, 60);
              raise exception 'Unknown public rate-limit bucket should fail';
            exception when others then
              if sqlerrm = 'Unknown public rate-limit bucket should fail' then raise; end if;
            end;

            if has_function_privilege('anon', 'public.consume_mcp_session_rate_limit(text,integer,integer)', 'EXECUTE')
              or has_function_privilege('authenticated', 'public.consume_mcp_session_rate_limit(text,integer,integer)', 'EXECUTE')
              or not has_function_privilege('service_role', 'public.consume_mcp_session_rate_limit(text,integer,integer)', 'EXECUTE') then
              raise exception 'Rate-limit RPC grants are incorrect';
            end if;

            insert into public.rub_minds_mcp_sessions(session_digest, expires_at)
              values (repeat('a', 64), now() + interval '1 hour');
            if not public.consume_mcp_session_rate_limit(repeat('a', 64), 2, 60) then
              raise exception 'First rate-limited call should be allowed';
            end if;
            if not public.consume_mcp_session_rate_limit(repeat('a', 64), 2, 60) then
              raise exception 'Second rate-limited call should be allowed';
            end if;
            if public.consume_mcp_session_rate_limit(repeat('a', 64), 2, 60) then
              raise exception 'Calls beyond the configured limit must be blocked';
            end if;
            select rate_request_count into counter from public.rub_minds_mcp_sessions where session_digest = repeat('a', 64);
            if counter <> 3 then raise exception 'Rate counter should cap at limit + 1, got %', counter; end if;

            update public.rub_minds_mcp_sessions
              set rate_window_started_at = now() - interval '61 seconds', rate_request_count = 100
              where session_digest = repeat('a', 64);
            if not public.consume_mcp_session_rate_limit(repeat('a', 64), 2, 60) then
              raise exception 'Expired rate window should reset';
            end if;
            update public.rub_minds_mcp_sessions set terminated_at = now() where session_digest = repeat('a', 64);
            if public.consume_mcp_session_rate_limit(repeat('a', 64), 2, 60) then
              raise exception 'Terminated sessions must not pass rate limiting';
            end if;

            if not (select relrowsecurity from pg_class where oid = 'public.rub_minds_mcp_join_requests'::regclass) then
              raise exception 'RLS must be enabled on MCP join requests';
            end if;
            if has_table_privilege('anon', 'public.rub_minds_mcp_join_requests', 'SELECT')
              or has_table_privilege('authenticated', 'public.rub_minds_mcp_join_requests', 'SELECT') then
              raise exception 'Client roles must not read MCP join requests';
            end if;
            if has_function_privilege('anon', 'public.redeem_ai_room_invite_idempotent(text,text,text,text)', 'EXECUTE')
              or has_function_privilege('authenticated', 'public.redeem_ai_room_invite_idempotent(text,text,text,text)', 'EXECUTE')
              or not has_function_privilege('service_role', 'public.redeem_ai_room_invite_idempotent(text,text,text,text)', 'EXECUTE') then
              raise exception 'Idempotent redemption RPC grants are incorrect';
            end if;

            insert into public.room_invites(token_hash, room_id, created_by, expires_at, allow_ai, max_ai_uses, ai_uses)
              values (encode(sha256(convert_to(repeat('b',64), 'UTF8')), 'hex'),
                      '10000000-0000-0000-0000-000000000001',
                      '20000000-0000-0000-0000-000000000001',
                      now() + interval '1 hour', true, 3, 0);
            select public.redeem_ai_room_invite_idempotent(
              repeat('b',64), 'CI agent', repeat('c',64), repeat('d',64)) into join_result;
            if join_result->>'replayed' <> 'false' then
              raise exception 'First join attempt must be marked replayed=false';
            end if;
            select public.redeem_ai_room_invite_idempotent(
              repeat('b',64), 'CI agent', repeat('c',64), repeat('d',64)) into join_result;
            if join_result->>'replayed' <> 'true' then
              raise exception 'Repeated join must be marked replayed=true';
            end if;
            if (select count(*) from public.participants where room_id = '10000000-0000-0000-0000-000000000001') <> 1 then
              raise exception 'Repeated join must create exactly one participant';
            end if;
            if (select ai_uses from public.room_invites where token_hash = encode(sha256(convert_to(repeat('b',64), 'UTF8')), 'hex')) <> 1 then
              raise exception 'Repeated join must consume exactly one invitation use';
            end if;
            if (select count(*) from public.rub_minds_mcp_join_requests where session_digest = repeat('c',64)) <> 1 then
              raise exception 'Repeated join must retain exactly one idempotency record';
            end if;
            if (select count(*) from public.participants where room_id = '10000000-0000-0000-0000-000000000002') <> 1 then
              raise exception 'Concurrent duplicate joins must create exactly one participant';
            end if;
            if (select ai_uses from public.room_invites where token_hash = encode(sha256(convert_to(repeat('e',64), 'UTF8')), 'hex')) <> 1 then
              raise exception 'Concurrent duplicate joins must consume exactly one invitation use';
            end if;
            if (select count(*) from public.rub_minds_mcp_join_requests where session_digest = repeat('f',64)) <> 1 then
              raise exception 'Concurrent duplicate joins must retain exactly one idempotency record';
            end if;
            -- Negative tests: expired, revoked, and exhausted invitations must never redeem.
            insert into public.room_invites(token_hash, room_id, created_by, expires_at, revoked_at, allow_ai, max_ai_uses, ai_uses)
            values
              (encode(sha256(convert_to(repeat('1',64), 'UTF8')), 'hex'),
               '10000000-0000-0000-0000-000000000003', '20000000-0000-0000-0000-000000000003',
               now() - interval '1 minute', null, true, 2, 0),
              (encode(sha256(convert_to(repeat('2',64), 'UTF8')), 'hex'),
               '10000000-0000-0000-0000-000000000004', '20000000-0000-0000-0000-000000000004',
               now() + interval '1 hour', now(), true, 2, 0),
              (encode(sha256(convert_to(repeat('3',64), 'UTF8')), 'hex'),
               '10000000-0000-0000-0000-000000000005', '20000000-0000-0000-0000-000000000005',
               now() + interval '1 hour', null, true, 1, 1);

            begin
              perform public.redeem_ai_room_invite_idempotent(repeat('1',64), 'Expired agent', repeat('1',64), repeat('a',64));
              raise exception 'Expired invitation unexpectedly redeemed';
            exception when others then
              if sqlerrm = 'Expired invitation unexpectedly redeemed' then raise; end if;
            end;
            begin
              perform public.redeem_ai_room_invite_idempotent(repeat('2',64), 'Revoked agent', repeat('2',64), repeat('b',64));
              raise exception 'Revoked invitation unexpectedly redeemed';
            exception when others then
              if sqlerrm = 'Revoked invitation unexpectedly redeemed' then raise; end if;
            end;
            begin
              perform public.redeem_ai_room_invite_idempotent(repeat('3',64), 'Exhausted agent', repeat('3',64), repeat('c',64));
              raise exception 'Exhausted invitation unexpectedly redeemed';
            exception when others then
              if sqlerrm = 'Exhausted invitation unexpectedly redeemed' then raise; end if;
            end;

            -- Malformed tokens and retries against revoked/expired prior joins must fail closed.
            begin
              perform public.redeem_ai_room_invite_idempotent('not-a-valid-token', 'Malformed agent', repeat('8',64), repeat('9',64));
              raise exception 'Malformed invitation unexpectedly redeemed';
            exception when others then
              if sqlerrm = 'Malformed invitation unexpectedly redeemed' then raise; end if;
            end;

            update public.agent_connections set revoked_at = now()
              where credential_digest = repeat('d',64);
            begin
              perform public.redeem_ai_room_invite_idempotent(repeat('b',64), 'CI agent', repeat('c',64), repeat('d',64));
              raise exception 'Revoked prior join unexpectedly replayed';
            exception when others then
              if sqlerrm = 'Revoked prior join unexpectedly replayed' then raise; end if;
            end;
            update public.agent_connections set revoked_at = null
              where credential_digest = repeat('d',64);
            update public.rub_minds_mcp_join_requests set expires_at = now() - interval '1 second'
              where session_digest = repeat('c',64);
            begin
              perform public.redeem_ai_room_invite_idempotent(repeat('b',64), 'CI agent', repeat('c',64), repeat('d',64));
              raise exception 'Expired prior join unexpectedly replayed';
            exception when others then
              if sqlerrm = 'Expired prior join unexpectedly replayed' then raise; end if;
            end;

            begin
              perform public.redeem_ai_room_invite_idempotent(
                repeat('b',64), 'Different label', repeat('c',64), repeat('d',64));
              raise exception 'Conflicting join retry should fail';
            exception when others then
              if sqlerrm = 'Conflicting join retry should fail' then raise; end if;
            end;
          end;
          $test$;
          SQL
  build:
    # Run validation on draft PRs as well; draft status does not imply a pass.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Report dependency audit findings
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const fs=require("node:fs"); const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/npm-audit.json","utf8")); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, vulnerabilities:Object.entries(a.vulnerabilities??{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:x.name)}))},null,2))'
      - name: Enforce dependency audit gate
        run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run test
      - run: npm run test:runtime
      - name: Test Backroom target registry, dispatcher and local host
        run: npm run test:backroom
      - name: Set up Deno for Supabase Edge Functions
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Test public rate-limit helper
        run: deno test supabase/functions/_shared/public-rate-limit.deno-test.ts
      - name: Type-check Backroom coordination Edge Functions
        run: deno check supabase/functions/backroom-config/index.ts supabase/functions/backroom-wake/index.ts supabase/functions/backroom-device/index.ts
      - name: Type-check public invite Edge Functions
        run: deno check supabase/functions/redeem-ai-invite/index.ts supabase/functions/ai-invite-discovery/index.ts
      - name: Type-check session-memory Edge Function
        run: deno check supabase/functions/session-memory/index.ts
      - name: Type-check hosted MCP Edge Function
        run: deno check supabase/functions/rub-minds-mcp/index.ts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run controlled browser proof of concept
        run: npm run test:browser
      - name: Run Backroom managed-browser end-to-end tests
        run: npm run test:backroom:browser


  android-companion:
    # Build the native companion independently from the web bundle.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # "tools" was removed from the Android SDK package repository.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: 8.10.2
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile and unit-test the Android companion
        working-directory: android-companion
        run: |
          gradle --no-daemon \
            -PSUPABASE_URL=https://rubminds-ci.supabase.co \
            -PSUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder \
            :app:testDebugUnitTest :app:auditDebugGuestHostManifest :app:assembleDebug

  local-supabase-stack:
    # Run validation on draft PRs as well; draft status does not imply a pass.
    runs-on: ubuntu-latest
    # GitHub-hosted runners are isolated; serialize only superseded runs of the same PR.
    # A global non-cancelling group can leave one queued job blocking every future local-stack test.
    concurrency:
      group: rub-minds-local-supabase-stack-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm ci
      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Install pinned official MCP client SDK for interoperability test
        run: npm install --no-save --package-lock=false @modelcontextprotocol/client@2.3.1
      - name: Install PostgreSQL client for Vault acceptance
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Clean up stale local Supabase containers from interrupted CI jobs
        run: supabase stop --no-backup || true
      - name: Start isolated local Supabase services
        run: supabase start -x studio,imgproxy,logflare,vector,analytics,pg_meta,pooler,inbucket,storage
      - name: Rebuild local database from every committed migration
        run: supabase db reset --local
      - name: Verify local migration history is fully applied
        run: |
          supabase migration list --local
          test -f supabase/config.toml
      - name: Test real browser signup and human invitation redemption
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export LOCAL_SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export LOCAL_SUPABASE_ANON_KEY="${ANON_KEY:?Local anon key missing}"
          export LOCAL_SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:?Local service-role key missing}"
          node scripts/local-human-invite-e2e.mjs
      - name: Verify local Supabase Vault key access boundary
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          : "${DB_URL:?Local Supabase database URL missing}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rub_minds_mcp_vault_encryption_key.sql
      - name: Verify private original-session bridge-state schema and grants
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          : "${DB_URL:?Local Supabase database URL missing}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/mcp_bridge_state.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/device_frame_bindings.sql
      - name: Start MCP Edge Function with Vault-only local credentials
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          : "${SERVICE_ROLE_KEY:?Local Supabase service-role key was not reported}"
          cat > "$RUNNER_TEMP/mcp.env" <<EOF
          SUPABASE_URL=${API_URL:-http://127.0.0.1:54321}
          SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
          EOF
          supabase functions serve rub-minds-mcp --env-file "$RUNNER_TEMP/mcp.env" > "$RUNNER_TEMP/mcp-edge.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/mcp-edge.pid"
          for attempt in $(seq 1 60); do
            status_code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:54321/functions/v1/rub-minds-mcp || true)"
            if [ "$status_code" = "405" ]; then exit 0; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/mcp-edge.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/mcp-edge.log"
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/mcp-edge.log"
          echo "MCP Edge Function did not become ready"
          exit 1
      - name: Exercise live local MCP discovery and tool catalog
        run: |
          eval "$(supabase status -o env)"
          export LOCAL_SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export LOCAL_SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:?Local service-role key missing}"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const endpoint = "http://127.0.0.1:54321/functions/v1/rub-minds-mcp";
          const version = "2026-07-28";
          async function rpc(method, id, tool = null) {
            const params = {
              _meta: {
                "io.modelcontextprotocol/protocolVersion": version,
                "io.modelcontextprotocol/clientCapabilities": {},
              },
            };
            const headers = {
              "Content-Type": "application/json",
              "Accept": "application/json, text/event-stream",
              "MCP-Protocol-Version": version,
              "Mcp-Method": method,
            };
            if (tool) {
              params.name = tool.name;
              params.arguments = tool.arguments;
              headers["Mcp-Name"] = tool.name;
            }
            const response = await fetch(endpoint, {
              method: "POST",
              headers,
              body: JSON.stringify({ jsonrpc: "2.0", id, method, params }),
            });
            const body = await response.json();
            assert.equal(response.status, 200, method + " HTTP status: " + JSON.stringify(body));
            assert.equal(body.id, id);
            assert.ok(body.result, method + " returned no result");
            return body.result;
          }
          const discovery = await rpc("server/discover", 1);
          assert.equal(discovery.resultType, "complete");
          assert.ok(discovery.supportedVersions.includes(version));
          const catalog = await rpc("tools/list", 2);
          assert.equal(catalog.resultType, "complete");
          const names = catalog.tools.map(tool => tool.name);
          assert.ok(names.includes("join_group"), "join_group missing from live tool catalog");
          assert.ok(names.includes("leave_group"), "leave_group missing from live tool catalog");
          const join = catalog.tools.find(tool => tool.name === "join_group");
          assert.ok(join.inputSchema.required.includes("join_request_key"), "join_group must require idempotency key");

          // Exercise the real join path against an invalid invite. This must fail closed.
          const invalidJoin = await rpc("tools/call", 3, {
            name: "join_group",
            arguments: {
              invite_token: "0".repeat(64),
              agent_label: "CI invalid invite",
              confirm_join: true,
              join_request_key: "1".repeat(64),
            },
          });
          assert.equal(invalidJoin.isError, true, "invalid invitation must return a tool error");
          assert.match(invalidJoin.structuredContent?.error || "", /Invitation is invalid|expired|revoked/i);

          // Use only the disposable local service-role key to prove failed joins did not persist a session or participant.
          const restHeaders = {
            apikey: process.env.LOCAL_SUPABASE_SERVICE_ROLE_KEY,
            Authorization: "Bearer " + process.env.LOCAL_SUPABASE_SERVICE_ROLE_KEY,
          };
          const sessionsResponse = await fetch(process.env.LOCAL_SUPABASE_URL + "/rest/v1/rub_minds_mcp_sessions?select=session_digest", { headers: restHeaders });
          assert.equal(sessionsResponse.status, 200, "could not verify local MCP session table");
          assert.deepEqual(await sessionsResponse.json(), [], "invalid invite must not create an MCP session");
          const participantsResponse = await fetch(process.env.LOCAL_SUPABASE_URL + "/rest/v1/participants?select=id&display_name=eq.CI%20invalid%20invite", { headers: restHeaders });
          assert.equal(participantsResponse.status, 200, "could not verify local participants table");
          assert.deepEqual(await participantsResponse.json(), [], "invalid invite must not create a participant");
          console.log("Local MCP discovery, tools/list, and invalid-invite fail-closed test passed:", names.join(", "));

          // Create an isolated local owner, room, and invitation, then exercise a successful AI join over the real MCP endpoint.
          import { createHash } from "node:crypto";
          const serviceKey = process.env.LOCAL_SUPABASE_SERVICE_ROLE_KEY;
          const apiUrl = process.env.LOCAL_SUPABASE_URL;
          const adminHeaders = {
            apikey: serviceKey,
            Authorization: "Bearer " + serviceKey,
            "Content-Type": "application/json",
          };
          const ownerResponse = await fetch(apiUrl + "/auth/v1/admin/users", {
            method: "POST",
            headers: adminHeaders,
            body: JSON.stringify({
              email: "rub-minds-mcp-ci-owner@example.test",
              password: "CI-only-Local-Password-923!x",
              email_confirm: true,
            }),
          });
          const ownerPayload = await ownerResponse.json();
          assert.ok(ownerResponse.status === 200 || ownerResponse.status === 201,
            "could not create disposable local owner: " + JSON.stringify(ownerPayload));
          const roomResponse = await fetch(apiUrl + "/rest/v1/rooms", {
            method: "POST",
            headers: { ...adminHeaders, Prefer: "return=representation" },
            body: JSON.stringify({
              owner_id: ownerPayload.id,
              title: "Local MCP end-to-end test",
              objective: "Disposable CI fixture",
            }),
          });
          const rooms = await roomResponse.json();
          assert.equal(roomResponse.status, 201, "could not create local test room: " + JSON.stringify(rooms));
          const room = rooms[0];
          const inviteToken = "c".repeat(64);
          const tokenHash = createHash("sha256").update(inviteToken, "utf8").digest("hex");
          const inviteResponse = await fetch(apiUrl + "/rest/v1/room_invites", {
            method: "POST",
            headers: { ...adminHeaders, Prefer: "return=representation" },
            body: JSON.stringify({
              room_id: room.id,
              created_by: ownerPayload.id,
              token_hash: tokenHash,
              expires_at: new Date(Date.now() + 60 * 60 * 1000).toISOString(),
              max_uses: 3,
              uses: 0,
              allow_ai: true,
              max_ai_uses: 3,
              ai_uses: 0,
            }),
          });
          const invites = await inviteResponse.json();
          assert.equal(inviteResponse.status, 201, "could not create local test invitation: " + JSON.stringify(invites));

          const joinArgs = {
            invite_token: inviteToken,
            agent_label: "CI AI participant",
            confirm_join: true,
            join_request_key: "2".repeat(64),
          };
          const [joined, retry] = await Promise.all([
            rpc("tools/call", 4, { name: "join_group", arguments: joinArgs }),
            rpc("tools/call", 5, { name: "join_group", arguments: joinArgs }),
          ]);
          assert.equal(joined.isError, undefined, "valid local invitation was rejected: " + JSON.stringify(joined));
          assert.equal(retry.isError, undefined, "concurrent retry was rejected: " + JSON.stringify(retry));
          assert.equal(joined.structuredContent?.joined, true, "MCP join did not report success");
          assert.match(joined.structuredContent?.session_handle || "", /^[a-f0-9]{64}$/i,
            "successful join must return an opaque session handle");
          assert.equal(joined.structuredContent?.room_id, room.id);
          assert.equal(retry.structuredContent?.joined, true, "concurrent idempotent retry did not preserve the joined session");
          assert.equal(retry.structuredContent?.session_handle, joined.structuredContent.session_handle,
            "concurrent requests with the same join key must return the same session handle");
          assert.equal(retry.structuredContent?.participant_id, joined.structuredContent.participant_id,
            "concurrent retry must not create a second participant");

          // A second independent AI joins with its own idempotency key and session handle.
          const secondJoin = await rpc("tools/call", 6, {
            name: "join_group",
            arguments: {
              invite_token: inviteToken,
              agent_label: "CI AI collaborator",
              confirm_join: true,
              join_request_key: "3".repeat(64),
            },
          });
          assert.equal(secondJoin.isError, undefined, "second independent AI could not join: " + JSON.stringify(secondJoin));
          assert.equal(secondJoin.structuredContent?.joined, true);
          assert.equal(secondJoin.structuredContent?.room_id, room.id);
          assert.notEqual(secondJoin.structuredContent?.participant_id, joined.structuredContent.participant_id,
            "independent AI clients must have distinct participant identities");
          assert.notEqual(secondJoin.structuredContent?.session_handle, joined.structuredContent.session_handle,
            "independent AI clients must have distinct session handles");

          // Prove a message sent by AI #1 is visible when AI #2 reads the shared group.
          const sent = await rpc("tools/call", 7, {
            name: "send_group_message",
            arguments: {
              session_handle: joined.structuredContent.session_handle,
              body: "Message from CI AI one to the shared group",
            },
          });
          assert.ok(sent.structuredContent?.message_id, "AI #1 message was not persisted");
          const read = await rpc("tools/call", 8, {
            name: "read_group_messages",
            arguments: { session_handle: secondJoin.structuredContent.session_handle },
          });
          assert.ok(Array.isArray(read.structuredContent?.messages), "AI #2 could not read group messages");
          assert.ok(read.structuredContent.messages.some(message => message.body === "Message from CI AI one to the shared group"),
            "AI #2 did not receive AI #1's group message");

          async function getRows(path) {
            const response = await fetch(apiUrl + "/rest/v1/" + path, { headers: adminHeaders });
            const payload = await response.json();
            assert.equal(response.status, 200, "local database verification failed for " + path + ": " + JSON.stringify(payload));
            return payload;
          }
          const participantRows = await getRows("participants?select=id,display_name&room_id=eq." + room.id + "&kind=eq.external_agent");
          assert.equal(participantRows.length, 2, "two independent AI joins plus idempotent retries must create exactly two AI participants");
          const inviteRows = await getRows("room_invites?select=ai_uses&id=eq." + invites[0].id);
          assert.equal(inviteRows[0]?.ai_uses, 2, "two independent AI joins must consume exactly two invitation uses");
          const sessionRows = await getRows("rub_minds_mcp_sessions?select=session_digest&room_id=eq." + room.id);
          assert.equal(sessionRows.length, 2, "two independent AI clients must persist exactly two sessions");
          const connectionRows = await getRows("agent_connections?select=id&room_id=eq." + room.id);
          assert.equal(connectionRows.length, 2, "two independent AI clients must create exactly two agent connections");
          console.log("Local MCP two-AI join and cross-client message relay passed:", room.id, joined.structuredContent.participant_id, secondJoin.structuredContent.participant_id);
          NODE
      - name: Test official MCP SDK client interoperability and session revocation
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export LOCAL_SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export LOCAL_SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:?Local service-role key missing}"
          export LOCAL_SUPABASE_ANON_KEY="${ANON_KEY:?Local anon key missing}"
          export LOCAL_MCP_ENDPOINT="http://127.0.0.1:54321/functions/v1/rub-minds-mcp"
          # The raw protocol smoke test and SDK test share a local IP. Clear
          # only disposable local-DB join limiter rows between independent tests;
          # keep the real production limit and client-address handling unchanged.
          curl --fail-with-body --silent --show-error --request DELETE \
            "$LOCAL_SUPABASE_URL/rest/v1/public_request_rate_limits?bucket=eq.rub-minds-mcp-join" \
            --header "apikey: $LOCAL_SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $LOCAL_SUPABASE_SERVICE_ROLE_KEY" \
            --header "Prefer: return=minimal"
          node scripts/local-mcp-sdk-e2e.mjs
      - name: Start Backroom device Edge Function
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          : "${SERVICE_ROLE_KEY:?Local Supabase service-role key missing}"
          if [ -f "$RUNNER_TEMP/mcp-edge.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/mcp-edge.pid")" 2>/dev/null || true
          fi
          cat > "$RUNNER_TEMP/backroom-device.env" <<EOF
          SUPABASE_URL=${API_URL:-http://127.0.0.1:54321}
          SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
          BACKROOM_DEVICE_ALLOWED_ORIGINS=
          EOF
          supabase functions serve backroom-device --env-file "$RUNNER_TEMP/backroom-device.env" > "$RUNNER_TEMP/backroom-device-edge.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backroom-device-edge.pid"
          for attempt in $(seq 1 60); do
            status_code="$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
              http://127.0.0.1:54321/functions/v1/backroom-device \
              --header "Content-Type: application/json" --data '{}' || true)"
            if [ "$status_code" = "400" ]; then exit 0; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/backroom-device-edge.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/backroom-device-edge.log"
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/backroom-device-edge.log"
          echo "Backroom device Edge Function did not become ready"
          exit 1
      - name: Test Backroom device pairing, inventory, group history and revocation
        run: |
          eval "$(supabase status -o env)"
          export LOCAL_SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export LOCAL_SUPABASE_ANON_KEY="${ANON_KEY:?Local anon key missing}"
          export LOCAL_SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:?Local service-role key missing}"
          node scripts/local-backroom-device-e2e.mjs
      - name: Stop isolated Supabase services
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/backroom-device-edge.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/backroom-device-edge.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/mcp-edge.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/mcp-edge.pid")" 2>/dev/null || true
          fi
          supabase stop --no-backup
