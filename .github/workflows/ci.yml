          console.log("Local MCP bridge-state load/save uses revision checks and rejects stale updates.");

          // Establish a durable baseline before testing the live wake. Without
          // this cursor checkpoint, a delayed MCP request could see the inserted
          // row during its initial snapshot and legitimately treat it as old history.
          const liveBaseline = await rpc("tools/call", 10, {
            name: "wait_for_group_messages",
            arguments: {
              session_handle: joined.structuredContent.session_handle,
              timeout_ms: 1000,
              limit: 10,
            },
          });
          assert.equal(liveBaseline.isError, undefined,
            "live wake baseline failed: " + JSON.stringify(liveBaseline));
          assert.equal(liveBaseline.structuredContent?.timed_out, true,
            "live wake baseline should start from a quiet room snapshot");
          assert.deepEqual(liveBaseline.structuredContent?.messages, [],
            "live wake baseline must not replay prior history");
          assert.ok(liveBaseline.structuredContent?.next_cursor?.after_created_at &&
            liveBaseline.structuredContent?.next_cursor?.after_message_id,
            "live wake baseline must produce a composite cursor");

          let liveWakeResult = null;
          let liveWakeMessageId = null;
          let liveCursor = liveBaseline.structuredContent.next_cursor;
          // Retry the explicit Realtime proof with progressively longer setup
          // windows. If insertion wins the subscription race, cursor/recovery reads
          // still advance safely; the test only counts an event-sourced wake as proof.
          const liveInsertDelays = [350, 900, 1500, 2100];
          for (let attempt = 0; attempt < liveInsertDelays.length && !liveWakeResult; attempt++) {
            const waitPromise = rpc("tools/call", 11 + attempt, {
              name: "wait_for_group_messages",
              arguments: {
                session_handle: joined.structuredContent.session_handle,
                ...liveCursor,
                timeout_ms: 4000,
                limit: 10,
              },
            });
            await new Promise(resolve => setTimeout(resolve, liveInsertDelays[attempt]));
            const liveId = "30000000-0000-4000-8000-" + String(attempt + 1).padStart(12, "0");
            const liveTimestamp = new Date(Date.parse(cursorTimestamp) + (attempt + 1) * 1000).toISOString();
            const liveInsert = await fetch(apiUrl + "/rest/v1/messages", {
              method: "POST",
              headers: { ...adminHeaders, Prefer: "return=minimal" },
              body: JSON.stringify({
                id: liveId,
                room_id: room.id,
                sender_id: joined.structuredContent.participant_id,
                body: "Live MCP wake signal " + (attempt + 1),
                created_at: liveTimestamp,
              }),
            });
            assert.equal(liveInsert.status, 201,
              "could not insert live wake message: " + await liveInsert.text());

            const result = await waitPromise;
            assert.equal(result.isError, undefined, "live MCP wait failed: " + JSON.stringify(result));
            const messages = result.structuredContent?.messages;
            assert.ok(Array.isArray(messages), "live MCP wait must return a message array");
            const matched = messages.find(message => message.id === liveId);
            const delivery = result.structuredContent?.delivery;
            if (matched && delivery === "realtime") {
              liveWakeResult = result;
              liveWakeMessageId = liveId;
            } else {
              const next = result.structuredContent?.next_cursor;
              assert.ok(next?.after_created_at && next?.after_message_id,
                "every live-wait result must preserve a valid composite cursor");
              if (delivery !== "realtime" && Array.isArray(messages) && messages.length > 0) {
                // A cursor read/recovery read can safely move past the returned
                // prefix; it does not count as proof that the subscription woke.
                liveCursor = next;
              } else if (result.structuredContent?.timed_out === true) {
                liveCursor = next;
              } else if (matched) {
                liveCursor = next;
              } else {
                throw new Error("Unexpected live-wait result: " + JSON.stringify(result.structuredContent));
              }
            }
          }
