name: Validate Rub Minds
permissions:
  contents: write
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Export generated lockfile for pinning
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Report dependency audit findings
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const fs=require("node:fs"); const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/npm-audit.json","utf8")); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, vulnerabilities:Object.entries(a.vulnerabilities??{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:x.name)}))},null,2))'
      - name: Enforce dependency audit gate
        run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run test
      - run: npm run test:runtime
      - name: Set up Deno for Supabase Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check session-memory Edge Function
        run: deno check supabase/functions/session-memory/index.ts
      - name: Type-check hosted MCP Edge Function
        run: deno check supabase/functions/rub-minds-mcp/index.ts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run controlled browser proof of concept
        run: npm run test:browser
      - name: Bootstrap package lockfile on the MCP branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/hosted-rub-minds-mcp'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          cp package-lock.json "$RUNNER_TEMP/package-lock.json"
          rm package-lock.json
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          cp "$RUNNER_TEMP/package-lock.json" package-lock.json
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): pin npm dependency tree"
          TOKEN_B64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $TOKEN_B64" push origin "HEAD:$BRANCH"
