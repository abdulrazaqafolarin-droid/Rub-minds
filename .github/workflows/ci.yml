          // Prove composite cursor reads are not truncated by the legacy latest-50 RPC.
          // All 60 messages share an exact timestamp and sort after a known cursor ID,
          // exercising the (created_at, id) tie-breaker against the real local PostgREST API.
          async function getRows(path) {
            const response = await fetch(apiUrl + "/rest/v1/" + path, { headers: adminHeaders });
            const payload = await response.json();
            assert.equal(response.status, 200, "local database verification failed for " + path + ": " + JSON.stringify(payload));
