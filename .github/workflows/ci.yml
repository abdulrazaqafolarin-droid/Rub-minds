          const emptyRoom = emptyRooms[0];
          const emptyInviteToken = randomBytes(32).toString("hex");
          const emptyTokenHash = createHash("sha256").update(emptyInviteToken, "utf8").digest("hex");
          const emptyInviteResponse = await fetch(apiUrl + "/rest/v1/room_invites", {
            method: "POST",
            headers: { ...adminHeaders, Prefer: "return=representation" },
            body: JSON.stringify({
              room_id: emptyRoom.id,
              created_by: ownerPayload.id,
              token_hash: emptyTokenHash,
