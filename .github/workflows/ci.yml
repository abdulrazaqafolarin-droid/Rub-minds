          const sentRows = await getRows("messages?select=id,created_at,sender_id&id=eq." + sent.structuredContent.message_id);
          assert.equal(sentRows.length, 1, "could not find the source message for the cursor fixture");
          const cursorAnchorId = "10000000-0000-4000-8000-000000000001";
          const cursorTimestamp = new Date(Date.parse(sentRows[0].created_at) + 2000).toISOString();
          const cursorBacklog = Array.from({ length: 60 }, (_, index) => ({
            id: "20000000-0000-4000-8000-" + String(index + 1).padStart(12, "0"),
            room_id: room.id,
            sender_id: joined.structuredContent.participant_id,
            body: "Cursor backlog " + String(index + 1).padStart(3, "0"),
            created_at: cursorTimestamp,
          }));
          const cursorRows = [{
            id: cursorAnchorId,
            room_id: room.id,
            sender_id: joined.structuredContent.participant_id,
            body: "Cursor anchor",
            created_at: cursorTimestamp,
          }, ...cursorBacklog];
          const cursorInsert = await fetch(apiUrl + "/rest/v1/messages", {
            method: "POST",
            headers: { ...adminHeaders, Prefer: "return=minimal" },
            body: JSON.stringify(cursorRows),
          });
          assert.equal(cursorInsert.status, 201, "could not create cursor backlog: " + await cursorInsert.text());

          // No-cursor reads are latest snapshots but must still honor the caller's
          // page size. The 61-row fixture catches regressions that fall back to
          // the legacy agent_exchange RPC's fixed latest-50 response.
          const latestSnapshot = await rpc("tools/call", 19, {
            name: "read_group_messages",
            arguments: {
              session_handle: joined.structuredContent.session_handle,
              limit: 10,
            },
          });
          assert.equal(latestSnapshot.isError, undefined,
            "bounded latest-message snapshot failed: " + JSON.stringify(latestSnapshot));
          assert.equal(latestSnapshot.structuredContent?.messages?.length, 10,
            "no-cursor read_group_messages must honor limit=10 even with a backlog greater than 50");
          assert.equal(latestSnapshot.structuredContent.messages[0]?.id, cursorBacklog[50].id,
            "latest snapshot should return the newest 10 messages in chronological order");
          assert.equal(latestSnapshot.structuredContent.messages.at(-1)?.id, cursorBacklog[59].id,
            "latest snapshot must end at the newest group message");
          console.log("Local MCP read_group_messages latest snapshot honors the bounded limit and chronological order.");

          // Verify the immediate read tool pages a backlog larger than the legacy
          // 50-row snapshot. The exact composite cursor must continue across
          // equal timestamps without duplicates or gaps.
          const readPage1 = await rpc("tools/call", 20, {
            name: "read_group_messages",
            arguments: {
              session_handle: joined.structuredContent.session_handle,
              after_created_at: cursorTimestamp,
              after_message_id: cursorAnchorId,
              limit: 20,
            },
          });
          assert.equal(readPage1.isError, undefined, "first immediate cursor page failed: " + JSON.stringify(readPage1));
          assert.equal(readPage1.structuredContent?.messages?.length, 20);
          assert.equal(readPage1.structuredContent.messages[0]?.id, cursorBacklog[0].id);
          assert.equal(readPage1.structuredContent.messages.at(-1)?.id, cursorBacklog[19].id);
          assert.deepEqual(readPage1.structuredContent.next_cursor, {
            after_created_at: readPage1.structuredContent.messages.at(-1).created_at,
            after_message_id: readPage1.structuredContent.messages.at(-1).id,
          });

          const readPage2 = await rpc("tools/call", 21, {
            name: "read_group_messages",
            arguments: {
              session_handle: joined.structuredContent.session_handle,
              ...readPage1.structuredContent.next_cursor,
              limit: 20,
            },
          });
          assert.equal(readPage2.isError, undefined, "second immediate cursor page failed: " + JSON.stringify(readPage2));
          assert.equal(readPage2.structuredContent?.messages?.length, 20);
          assert.equal(readPage2.structuredContent.messages[0]?.id, cursorBacklog[20].id);
          assert.equal(readPage2.structuredContent.messages.at(-1)?.id, cursorBacklog[39].id);

          const readPage3 = await rpc("tools/call", 22, {
            name: "read_group_messages",
            arguments: {
              session_handle: joined.structuredContent.session_handle,
              ...readPage2.structuredContent.next_cursor,
              limit: 20,
            },
          });
          assert.equal(readPage3.isError, undefined, "third immediate cursor page failed: " + JSON.stringify(readPage3));
          assert.equal(readPage3.structuredContent?.messages?.length, 20);
          assert.equal(readPage3.structuredContent.messages[0]?.id, cursorBacklog[40].id);
          assert.equal(readPage3.structuredContent.messages.at(-1)?.id, cursorBacklog[59].id);
          const pagedIds = [
            ...readPage1.structuredContent.messages,
