          assert.equal(liveWakeResult.structuredContent?.delivery, "realtime",
            "the live wait must be resumed by an observed Realtime event, not only a recovery read");
          assert.ok(liveWakeResult.structuredContent.messages.some(message => message.id === liveWakeMessageId),
            "live wake response omitted its triggering message");
          assert.deepEqual(liveWakeResult.structuredContent.next_cursor, {
            after_created_at: liveWakeResult.structuredContent.messages.at(-1).created_at,
            after_message_id: liveWakeResult.structuredContent.messages.at(-1).id,
          }, "live wake response should return a cursor for the last message in its batch");
          console.log("Local MCP live wait recovered a newly inserted room message from a Realtime event and returned its next cursor.");

          // Verify that a truly empty room gets a valid initial cursor, then wakes
