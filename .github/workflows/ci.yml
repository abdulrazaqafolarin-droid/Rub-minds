          assert.equal(idleWait.isError, undefined, "timeout cursor continuation failed: " + JSON.stringify(idleWait));
          assert.equal(idleWait.structuredContent?.timed_out, true, "empty cursor page should time out");
          assert.deepEqual(idleWait.structuredContent?.messages, [], "empty cursor page should not replay earlier messages");
          assert.deepEqual(idleWait.structuredContent?.next_cursor, cursorRead.structuredContent.next_cursor,
            "timeout must preserve the latest cursor so clients can retry without losing their position");
          // Exercise persistent bridge-state tools through the live MCP server,
          // including revision conflicts that must not overwrite a newer snapshot.
          const stateLoad = await rpc("tools/call", 40, {
            name: "load_original_session_bridge_state",
            arguments: { session_handle: joined.structuredContent.session_handle },
