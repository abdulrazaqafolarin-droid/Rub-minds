          assert.equal(emptyJoin.structuredContent?.room_id, emptyRoom.id);

          const emptyBaseline = await rpc("tools/call", 31, {
            name: "wait_for_group_messages",
            arguments: {
              session_handle: emptyJoin.structuredContent.session_handle,
              timeout_ms: 1000,
              limit: 10,
            },
          });
          assert.equal(emptyBaseline.isError, undefined, "empty-room baseline read failed: " + JSON.stringify(emptyBaseline));
          assert.equal(emptyBaseline.structuredContent?.timed_out, true,
            "an empty room should finish its baseline with a bounded timeout");
          assert.deepEqual(emptyBaseline.structuredContent?.messages, [],
            "the empty-room baseline must not invent or replay messages");
          assert.deepEqual(emptyBaseline.structuredContent?.next_cursor, {
            after_created_at: "1970-01-01T00:00:00.000Z",
            after_message_id: "00000000-0000-1000-8000-000000000000",
          }, "an empty room should return the valid epoch composite cursor");

          const emptyWakePromise = rpc("tools/call", 32, {
            name: "wait_for_group_messages",
            arguments: {
              session_handle: emptyJoin.structuredContent.session_handle,
              ...emptyBaseline.structuredContent.next_cursor,
              timeout_ms: 5000,
              limit: 10,
            },
          });
          await new Promise(resolve => setTimeout(resolve, 250));
          const emptyMessageId = "50000000-0000-4000-8000-000000000001";
          const emptyMessageInsert = await fetch(apiUrl + "/rest/v1/messages", {
            method: "POST",
            headers: { ...adminHeaders, Prefer: "return=minimal" },
            body: JSON.stringify({
              id: emptyMessageId,
              room_id: emptyRoom.id,
              sender_id: emptyJoin.structuredContent.participant_id,
              body: "First message in the empty room",
            }),
          });
          assert.equal(emptyMessageInsert.status, 201, "could not send first empty-room message: " + await emptyMessageInsert.text());
          const emptyWake = await emptyWakePromise;
          assert.equal(emptyWake.isError, undefined, "empty-room live wait failed: " + JSON.stringify(emptyWake));
          assert.equal(emptyWake.structuredContent?.timed_out, false, "the first message should wake the empty-room listener");
          assert.ok(["realtime", "realtime-recovery-read", "cursor-read"].includes(emptyWake.structuredContent?.delivery),
            "the first empty-room message must be returned without loss, whether it arrives during the initial cursor read, Realtime wait, or recovery read");
          assert.ok(emptyWake.structuredContent?.messages?.some(message => message.id === emptyMessageId),
            "the first message after an empty-room baseline must be returned");
          assert.deepEqual(emptyWake.structuredContent?.next_cursor, {
            after_created_at: emptyWake.structuredContent.messages.at(-1).created_at,
            after_message_id: emptyWake.structuredContent.messages.at(-1).id,
          });
          // Durable per-session bridge state is isolated to the joined MCP handle,
          // uses compare-and-swap revisions, and can be explicitly cleared.
          const loadedBridgeState = await rpc("tools/call", 40, {
            name: "load_original_session_bridge_state",
            arguments: { session_handle: secondJoin.structuredContent.session_handle },
          });
          assert.equal(loadedBridgeState.isError, undefined,
            "bridge-state load failed: " + JSON.stringify(loadedBridgeState));
          assert.equal(loadedBridgeState.structuredContent.revision, 0);
          assert.equal(loadedBridgeState.structuredContent.cursor, null);
          const stateAnchorMessage = read.structuredContent.messages.at(-1);
          assert.ok(stateAnchorMessage?.id && stateAnchorMessage?.created_at,
            "state test needs one real message to anchor its cursor");
          const stateFields = {
            cursor_created_at: stateAnchorMessage.created_at,
            cursor_message_id: stateAnchorMessage.id,
            pending_message_id: null,
            pending_message_created_at: null,
            pending_response: null,
            blocked_message_id: null,
            blocked_reason: null,
          };
          const savedBridgeState = await rpc("tools/call", 41, {
            name: "save_original_session_bridge_state",
            arguments: {
              session_handle: secondJoin.structuredContent.session_handle,
              expected_revision: loadedBridgeState.structuredContent.revision,
              ...stateFields,
            },
          });
          assert.equal(savedBridgeState.isError, undefined,
            "bridge-state save failed: " + JSON.stringify(savedBridgeState));
          assert.equal(savedBridgeState.structuredContent.saved, true);
          assert.equal(savedBridgeState.structuredContent.revision, 1);
          const reloadedBridgeState = await rpc("tools/call", 42, {
            name: "load_original_session_bridge_state",
            arguments: { session_handle: secondJoin.structuredContent.session_handle },
          });
          assert.deepEqual(reloadedBridgeState.structuredContent.cursor, {
            after_created_at: stateAnchorMessage.created_at,
            after_message_id: stateAnchorMessage.id,
          });
          const staleStateSave = await rpc("tools/call", 43, {
            name: "save_original_session_bridge_state",
            arguments: {
              session_handle: secondJoin.structuredContent.session_handle,
              expected_revision: 0,
              cursor_created_at: null,
              cursor_message_id: null,
              pending_message_id: null,
              pending_message_created_at: null,
              pending_response: null,
              blocked_message_id: null,
              blocked_reason: null,
            },
          });
          assert.equal(staleStateSave.isError, undefined);
          assert.equal(staleStateSave.structuredContent.saved, false);
          assert.equal(staleStateSave.structuredContent.conflict, true);
          assert.equal(staleStateSave.structuredContent.revision, 1);
          const clearedBridgeState = await rpc("tools/call", 44, {
            name: "save_original_session_bridge_state",
            arguments: {
              session_handle: secondJoin.structuredContent.session_handle,
              expected_revision: 1,
              cursor_created_at: null,
              cursor_message_id: null,
              pending_message_id: null,
              pending_message_created_at: null,
              pending_response: null,
              blocked_message_id: null,
              blocked_reason: null,
            },
          });
          assert.equal(clearedBridgeState.structuredContent.saved, true);
          assert.equal(clearedBridgeState.structuredContent.revision, 2);
          console.log("Local MCP bridge state persisted, isolated by session, and rejected stale revisions.");

          console.log("Local MCP empty-room baseline used the valid epoch cursor and woke on the first inserted message.");

          console.log("Local MCP live wait recovered a newly inserted room message and returned its next cursor.");

          console.log("Local MCP exclusive composite cursor returned all 60 tied-timestamp rows, then preserved its cursor on timeout.");

          const participantRows = await getRows("participants?select=id,display_name&room_id=eq." + room.id + "&kind=eq.external_agent");
          assert.equal(participantRows.length, 2, "two independent AI joins plus idempotent retries must create exactly two AI participants");
          const inviteRows = await getRows("room_invites?select=ai_uses&id=eq." + invites[0].id);
          assert.equal(inviteRows[0]?.ai_uses, 2, "two independent AI joins must consume exactly two invitation uses");
          const sessionRows = await getRows("rub_minds_mcp_sessions?select=session_digest&room_id=eq." + room.id);
          assert.equal(sessionRows.length, 2, "two independent AI clients must persist exactly two sessions");
          const connectionRows = await getRows("agent_connections?select=id&room_id=eq." + room.id);
          assert.equal(connectionRows.length, 2, "two independent AI clients must create exactly two agent connections");
          // Exercise the concrete bridge transport against the actual disposable
          // hosted-MCP endpoint, rather than only testing it with fake fetch responses.
          const { McpSessionMessageTransport } = await import("./integrations/playwright/mcp-session-message-transport.mjs");
          const transport = new McpSessionMessageTransport({
            endpoint,
            sessionHandle: joined.structuredContent.session_handle,
            fetchImpl: fetch,
          });
          const transportBaseline = await transport.readMessages({ baseline: true });
          assert.ok(Array.isArray(transportBaseline.messages), "transport could not read the group snapshot");
          const transportSent = await transport.sendMessage(
            "Concrete MCP transport end-to-end roundtrip",
            "mcp-transport-ci-source-001",
          );
          assert.ok(transportSent.message_id, "transport did not send a source-keyed group message");
          const transportSnapshot = await transport.readMessages({ baseline: true });
          assert.ok(transportSnapshot.messages.some(message =>
            message.id === transportSent.message_id &&
            message.body === "Concrete MCP transport end-to-end roundtrip"),
            "transport could not read back its own sent message");
          console.log("Concrete MCP message transport passed local read/send/read roundtrip.");
          console.log("Local MCP two-AI join and cross-client message relay passed:", room.id, joined.structuredContent.participant_id, secondJoin.structuredContent.participant_id);
          NODE
      - name: Test official MCP SDK client interoperability and session revocation
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export LOCAL_SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export LOCAL_SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:?Local service-role key missing}"
          export LOCAL_SUPABASE_ANON_KEY="${ANON_KEY:?Local anon key missing}"
          export LOCAL_MCP_ENDPOINT="http://127.0.0.1:54321/functions/v1/rub-minds-mcp"
          # The raw protocol smoke test and SDK test share a local IP. Clear
          # only disposable local-DB join limiter rows between independent tests;
          # keep the real production limit and client-address handling unchanged.
          curl --fail-with-body --silent --show-error --request DELETE \
            "$LOCAL_SUPABASE_URL/rest/v1/public_request_rate_limits?bucket=eq.rub-minds-mcp-join" \
            --header "apikey: $LOCAL_SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $LOCAL_SUPABASE_SERVICE_ROLE_KEY" \
            --header "Prefer: return=minimal"
          node scripts/local-mcp-sdk-e2e.mjs
      - name: Stop isolated Supabase services
        if: always()
        run: supabase stop --no-backup
