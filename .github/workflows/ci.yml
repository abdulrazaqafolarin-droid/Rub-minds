          assert.equal(stateLoad.isError, undefined, "could not load durable bridge state: " + JSON.stringify(stateLoad));
          assert.equal(stateLoad.structuredContent?.revision, 0);
          const stateSave = await rpc("tools/call", 41, {
            name: "save_original_session_bridge_state",
            arguments: {
              session_handle: joined.structuredContent.session_handle,
