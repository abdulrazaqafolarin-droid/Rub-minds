          assert.equal(cursorRead.isError, undefined, "composite cursor read failed: " + JSON.stringify(cursorRead));
          const cursorMessages = cursorRead.structuredContent?.messages;
          assert.ok(Array.isArray(cursorMessages), "cursor tool did not return a message array");
          assert.equal(cursorMessages.length, 60,
            "composite cursor must return all 60 unread messages instead of truncating to the latest 50");
          assert.equal(cursorMessages[0]?.id, cursorBacklog[0].id, "cursor should return messages in ascending composite-key order");
          assert.equal(cursorMessages.at(-1)?.id, cursorBacklog.at(-1).id, "cursor should return the last unread row in the batch");
          assert.ok(cursorMessages.every(message => message.body !== "Cursor anchor"),
            "cursor result must exclude the anchor message itself");
          assert.deepEqual(cursorRead.structuredContent?.next_cursor, {
            after_created_at: cursorMessages.at(-1).created_at,
            after_message_id: cursorMessages.at(-1).id,
          }, "next_cursor must point to the last row returned in the page");

          const idleWait = await rpc("tools/call", 10, {
            name: "wait_for_group_messages",
