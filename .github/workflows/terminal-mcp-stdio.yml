name: Terminal MCP stdio interoperability

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rub-minds-terminal-stdio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  official-mcp-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install project dependencies
        run: npm ci
      - name: Install pinned official MCP client
        run: npm install --no-save --package-lock=false @modelcontextprotocol/client@2.3.1
      - name: Test the real stdio child process with the official MCP client
        run: npm run test:mcp:stdio-proxy:interop

  opencode-v2-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install official OpenCode V2 CLI
        run: npm install --global @opencode/cli
      - name: Register bridge in an isolated OpenCode project configuration
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/rub-minds-opencode-config
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rub-minds-opencode-workspace"
          cd "$RUNNER_TEMP/rub-minds-opencode-workspace"
          git init -q
          opencode --version
          cat > opencode.json <<EOF
          {
            "mcp": {
              "servers": {
                "rub_minds": {
                  "type": "local",
                  "command": [
                    "node",
                    "$GITHUB_WORKSPACE/scripts/rub-minds-mcp.mjs",
                    "--stdio"
                  ],
                  "environment": {
                    "RUB_MINDS_MCP_ENDPOINT": "https://tzcuuynmviiuactafpld.supabase.co/functions/v1/rub-minds-mcp",
                    "RUB_MINDS_MCP_API_KEY": "rub-minds-public-test-key",
                    "RUB_MINDS_STDIO_E2E_FIXTURE": "1",
                    "NODE_OPTIONS": "--import=$GITHUB_WORKSPACE/integrations/mcp/stdio-proxy-test-upstream.mjs"
                  },
                  "timeout": {
                    "startup": 45000,
                    "catalog": 30000
                  },
                  "protocol": "legacy"
                }
              }
            }
          }
          EOF
          node -e "const c=JSON.parse(require('fs').readFileSync('opencode.json','utf8'));if(c.mcp?.servers?.rub_minds?.type!=='local')process.exit(1)"
          echo "Project-level OpenCode MCP server definition validated."
      - name: Verify OpenCode reports the spawned Rub Minds MCP server connected
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/rub-minds-opencode-config
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rub-minds-opencode-workspace"
          output=""
          for attempt in 1 2 3 4 5; do
            output="$(opencode mcp list --print-logs 2>&1 || true)"
            printf 'OpenCode MCP check %s:\n%s\n' "$attempt" "$output"
            if grep -Fq "rub_minds" <<<"$output" && grep -Eqi "connected|ready" <<<"$output"; then
              exit 0
            fi
            sleep 2
          done
          echo "OpenCode did not report the Rub Minds stdio bridge connected after five checks." >&2
          exit 1

  claude-code-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install official Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code
      - name: Register and connect the Rub Minds local stdio MCP server
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/rub-minds-claude-config
        run: |
          set -euo pipefail
          mkdir -p "$CLAUDE_CONFIG_DIR" "$RUNNER_TEMP/rub-minds-claude-workspace"
          cd "$RUNNER_TEMP/rub-minds-claude-workspace"
          git init -q
          claude --version
          claude mcp add --scope user --transport stdio \
            --env "RUB_MINDS_MCP_ENDPOINT=https://tzcuuynmviiuactafpld.supabase.co/functions/v1/rub-minds-mcp" \
            --env "RUB_MINDS_MCP_API_KEY=rub-minds-public-test-key" \
            --env "RUB_MINDS_STDIO_E2E_FIXTURE=1" \
            --env "NODE_OPTIONS=--import=$GITHUB_WORKSPACE/integrations/mcp/stdio-proxy-test-upstream.mjs" \
            rub_minds -- node "$GITHUB_WORKSPACE/scripts/rub-minds-mcp.mjs" --stdio
          output=""
          for attempt in 1 2 3 4 5; do
            output="$(claude mcp get rub_minds 2>&1 || true)"
            printf 'Claude Code MCP check %s:\\n%s\\n' "$attempt" "$output"
            if grep -Fq "rub_minds" <<<"$output" && grep -Eqi "Connected|connected" <<<"$output"; then
              exit 0
            fi
            sleep 2
          done
          echo "Claude Code did not report the Rub Minds stdio bridge connected after five checks." >&2
          exit 1
