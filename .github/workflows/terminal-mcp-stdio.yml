name: Terminal MCP stdio interoperability

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rub-minds-terminal-stdio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  official-mcp-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install project dependencies
        run: npm ci
      - name: Install pinned official MCP client
        run: npm install --no-save --package-lock=false @modelcontextprotocol/client@2.3.1
      - name: Test the real stdio child process with the official MCP client
        run: npm run test:mcp:stdio-proxy:interop

  opencode-v2-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install official OpenCode V2 CLI
        run: npm install --global @opencode/cli
      - name: Write documented OpenCode V2 project MCP configuration
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rub-minds-opencode-workspace"
          cd "$RUNNER_TEMP/rub-minds-opencode-workspace"
          git init --quiet
          git config user.name "Rub Minds CI"
          git config user.email "rub-minds-ci@example.invalid"
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const workspace = process.env.GITHUB_WORKSPACE;
          const config = {
            "$schema": "https://opencode.ai/config.json",
            mcp: {
              servers: {
                rub_minds: {
                  type: "local",
                  command: ["node", workspace + "/scripts/rub-minds-mcp.mjs", "--stdio"],
                  cwd: workspace,
                  environment: {
                    RUB_MINDS_MCP_ENDPOINT: "https://tzcuuynmviiuactafpld.supabase.co/functions/v1/rub-minds-mcp",
                    RUB_MINDS_MCP_API_KEY: "rub-minds-public-test-key",
                  },
                  protocol: "legacy",
                  codemode: false,
                },
              },
            },
          };
          writeFileSync("opencode.json", JSON.stringify(config, null, 2) + "\\n");
          NODE
          git add opencode.json
          git commit -m "Add isolated Rub Minds MCP server configuration"
          cat opencode.json
      - name: Verify OpenCode reports the spawned Rub Minds MCP server connected
        env:
          RUB_MINDS_STDIO_E2E_FIXTURE: "1"
          NODE_OPTIONS: --import=${{ github.workspace }}/integrations/mcp/stdio-proxy-test-upstream.mjs
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rub-minds-opencode-workspace"
          output="$(opencode --standalone mcp list --print-logs 2>&1)"
          printf '%s\\n' "$output"
          grep -Fq "rub_minds" <<<"$output"
          grep -Eqi "connected|ready" <<<"$output"
