name: Backroom Windows desktop companion

permissions:
  contents: read

concurrency:
  group: backroom-desktop-companion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, feat/backroom-virtualized-execution]
    paths:
      - '.github/workflows/backroom-desktop-companion.yml'
      - 'desktop-companion/**'
      - 'src/BackroomDesktopControl.tsx'
      - 'src/BackroomDevicesApp.tsx'
      - 'src/backroom-cloud.css'
      - 'integrations/backroom/desktop-target-selection.mjs'
      - 'integrations/backroom/desktop-target-selection.node-test.mjs'
      - 'integrations/backroom/video-selection-overlay.mjs'
      - 'integrations/backroom/video-selection-overlay.node-test.mjs'
      - 'integrations/backroom/emergency-stop-orchestrator.*'
      - 'package.json'
      - 'package-lock.json'

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Run full web tests and production build
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_ANON_KEY: ""
        run: npm run build
      - name: Build the bundled companion WebView
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_ANON_KEY: ""
        run: npm run build:desktop-companion
      - name: Check native Rust formatting
        run: cargo fmt --manifest-path desktop-companion/src-tauri/Cargo.toml -- --check
      - name: Run native Windows Rust tests
        run: cargo test --manifest-path desktop-companion/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Run companion protocol and authorization regression tests
        run: npm run test:companion
      - name: Link the actual Windows release executable
        run: cargo build --release --manifest-path desktop-companion/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Verify and fingerprint Windows executable
        shell: pwsh
        run: |
          $exe = "desktop-companion/src-tauri/target/x86_64-pc-windows-msvc/release/rub-minds-backroom-companion.exe"
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "Linked Windows companion executable is missing: $exe"
          }
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $exe).Length
          if ($size -le 0) { throw "Windows companion executable is empty: $exe" }
          @(
            "repository=$env:GITHUB_REPOSITORY"
            "commit=$env:GITHUB_SHA"
            "run_id=$env:GITHUB_RUN_ID"
            "target=x86_64-pc-windows-msvc"
            "artifact=rub-minds-backroom-companion.exe"
            "backend_configuration=empty; local-launch-and-native-build-verification-only"
            "size_bytes=$size"
            "sha256=$hash"
          ) | Set-Content -Path "desktop-companion/src-tauri/target/x86_64-pc-windows-msvc/release/acceptance-manifest.txt" -Encoding utf8
          Get-Content "desktop-companion/src-tauri/target/x86_64-pc-windows-msvc/release/acceptance-manifest.txt"
      - name: Upload Windows release executable for hardware acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rub-minds-backroom-windows-x64-${{ github.sha }}
          path: |
            desktop-companion/src-tauri/target/x86_64-pc-windows-msvc/release/rub-minds-backroom-companion.exe
            desktop-companion/src-tauri/target/x86_64-pc-windows-msvc/release/acceptance-manifest.txt
          if-no-files-found: error
          retention-days: 7
