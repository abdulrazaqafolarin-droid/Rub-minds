name: Backroom Windows desktop companion

permissions:
  contents: read

concurrency:
  group: backroom-desktop-companion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, feat/backroom-virtualized-execution]
    paths:
      - '.github/workflows/backroom-desktop-companion.yml'
      - 'desktop-companion/**'
      - 'src/BackroomDesktopControl.tsx'
      - 'src/BackroomDevicesApp.tsx'
      - 'src/backroom-cloud.css'
      - 'integrations/backroom/desktop-target-selection.mjs'
      - 'integrations/backroom/desktop-target-selection.node-test.mjs'
      - 'package.json'
      - 'package-lock.json'

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Run full web tests and production build
        run: npm run build
      - name: Build the bundled companion WebView
        run: npm run build:desktop-companion
      - name: Run native companion unit tests
        run: cargo test --manifest-path desktop-companion/src-tauri/Cargo.toml
      - name: Run companion protocol and authorization regression tests
        run: npm run test:companion
      - name: Compile the actual Windows native companion
        run: cargo check --manifest-path desktop-companion/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
