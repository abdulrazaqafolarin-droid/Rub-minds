[package]
name = "rub-minds-backroom-companion"
version = "0.1.0"
description = "Account-connected native desktop execution companion for Rub Minds Backroom"
authors = ["Rub Minds"]
edition = "2021"

[lib]
name = "rub_minds_backroom_companion"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
keyring = "4.2.0"
portable-pty = "0.9.0"
enigo = "0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
